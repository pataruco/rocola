[workspace]
resolver = "3"
members = ["rocola-core", "rocola-spotify", "rocola-apple", "rocola"]

[workspace.package]
edition = "2024"
repository = "https://github.com/pataruco/rocola"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "forbid"
