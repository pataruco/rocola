[package]
name = "rocola-spotify"
version = "0.0.0"
edition.workspace = true
repository.workspace = true
description = "Spotify source for rocola: PKCE auth and playlist fetch."

[lints]
workspace = true

[dependencies]
rocola-core = { path = "../rocola-core", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
tokio = { version = "1", features = ["net", "io-util", "macros", "time"] }
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
open = "5"
