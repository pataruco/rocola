[package]
name = "rocola-apple"
version = "0.0.0"
edition.workspace = true
repository.workspace = true
description = "Apple Music target for rocola: tokens, catalog resolve, playlist write."

[lints]
workspace = true

[dependencies]
rocola-core = { path = "../rocola-core", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1", features = ["macros", "time", "net", "rt", "sync"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
axum = "0.8"
open = "5"

[dev-dependencies]
base64 = "0.23"
